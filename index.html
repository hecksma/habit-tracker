<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Maximize</title>
<!-- Farbe der Statusleiste auf dem Handy, passend zum Hintergrund -->
<meta name="theme-color" content="#1C2B27" />
<!-- Verweis auf die manifest.json: Sie sagt Android, wie die App heißt und aussieht, wenn sie installiert wird -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #1C2B27;
    --bg-elevated: #223832;
    --ink: #F1EFE7;
    --ink-dim: #A9B8B2;
    --amber: #E8A33D;
    --sage: #7FA285;
    --danger: #C97A6D;
    --border: rgba(241, 239, 231, 0.12);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    padding: 32px 20px 100px;
    max-width: 480px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 28px;
  }

  .eyebrow {
    font-size: 13px;
    color: var(--sage);
    margin: 0 0 6px;
    font-weight: 500;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 34px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--ink-dim);
    font-size: 14px;
    margin: 0;
    line-height: 1.5;
  }

  .habit-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 24px;
  }

  .habit-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color 0.2s ease;
  }

  .habit-card.done {
    border-color: rgba(232, 163, 61, 0.5);
  }

  .check-btn {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid var(--ink-dim);
    background: transparent;
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    padding: 0;
  }

  .check-btn.done {
    background: var(--amber);
    border-color: var(--amber);
    color: var(--bg);
  }

  .check-btn:active {
    transform: scale(0.92);
  }

  .habit-info {
    flex: 1;
    min-width: 0;
  }

  .habit-name {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    margin: 0 0 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .streak-row {
    display: flex;
    align-items: baseline;
    gap: 5px;
    color: var(--ink-dim);
    font-size: 13px;
  }

  .streak-num {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--amber);
    font-weight: 600;
  }

  .delete-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 18px;
    cursor: pointer;
    padding: 8px;
    line-height: 1;
    opacity: 0.6;
  }

  .delete-btn:active {
    opacity: 1;
    color: var(--danger);
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-dim);
  }

  .empty-state .big {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .add-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    padding: 24px 20px 20px;
    display: flex;
    justify-content: center;
  }

  .add-form {
    width: 100%;
    max-width: 440px;
    display: flex;
    gap: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 6px 6px 18px;
  }

  .add-form input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    min-width: 0;
  }

  .add-form input::placeholder {
    color: var(--ink-dim);
  }

  .add-form button {
    background: var(--sage);
    color: var(--bg);
    border: none;
    border-radius: 999px;
    width: 40px;
    height: 40px;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .add-form button:active {
    transform: scale(0.94);
  }

  .add-form button:disabled {
    opacity: 0.4;
  }

  .loading, .error-banner {
    text-align: center;
    color: var(--ink-dim);
    padding: 40px 0;
    font-size: 14px;
  }

  .error-banner {
    color: var(--danger);
  }

  .data-tools {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .tool-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-dim);
    border-radius: 999px;
    padding: 10px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }

  .tool-btn:active { color: var(--ink); border-color: var(--ink-dim); }

  .status {
    margin: 12px 0 0;
    font-size: 13px;
    color: var(--sage);
    min-height: 1em;
  }

  .status.error { color: var(--danger); }
</style>
</head>
<body>

<header>
  <p class="eyebrow" id="todayLabel">Maximize</p>
  <h1>Deine Gewohnheiten</h1>
  <p class="subtitle" id="subtitle">Tippe den Kreis, wenn du eine Gewohnheit heute erledigt hast.</p>
</header>

<div id="content">
  <div class="loading">Lade deine Daten …</div>
</div>

<!-- Sicherung: Export schreibt alle Gewohnheiten in eine Datei, Import liest sie wieder ein -->
<div class="data-tools">
  <button type="button" class="tool-btn" id="exportBtn">Daten sichern</button>
  <button type="button" class="tool-btn" id="importBtn">Daten wiederherstellen</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden />
</div>
<p class="status" id="status" role="status" aria-live="polite"></p>

<div class="add-bar">
  <form class="add-form" id="addForm">
    <input type="text" id="habitInput" placeholder="Neue Gewohnheit, z. B. 'Lesen'" maxlength="40" autocomplete="off" />
    <button type="submit" id="addBtn" aria-label="Hinzufügen">+</button>
  </form>
</div>

<script>
  // Unter diesem Namen liegen deine Daten im Browser-Speicher (localStorage)
  const STORAGE_KEY = 'maximize-habits';
  // Alter Speicherort aus der Zeit, als die App noch anders hieß.
  // Wir lesen ihn weiter, damit bestehende Daten nicht verloren gehen.
  const LEGACY_STORAGE_KEY = 'wegmarken-habits';
  let habits = [];
  let loaded = false;

  const contentEl = document.getElementById('content');
  const subtitleEl = document.getElementById('subtitle');
  const addForm = document.getElementById('addForm');
  const habitInput = document.getElementById('habitInput');

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // Zeigt das heutige Datum oben an, z. B. "Samstag, 24. Oktober".
  // toLocaleDateString formatiert ein Datum passend zur Sprache ('de-DE' = Deutsch).
  function showTodayLabel() {
    const text = new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
    document.getElementById('todayLabel').textContent = text;
  }

  function dateStrDaysAgo(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function computeStreak(completions) {
    const set = new Set(completions);
    const today = todayStr();
    let streak = 0;
    let offset = set.has(today) ? 0 : 1;
    // if not done today, streak counts back from yesterday; if today done, count from today
    while (set.has(dateStrDaysAgo(offset))) {
      streak++;
      offset++;
    }
    return streak;
  }

  // localStorage ist ein kleiner Speicher, den jeder Browser mitbringt.
  // Er speichert nur Text, deshalb wandeln wir die Liste mit JSON.stringify in Text um
  // (beim Speichern) und mit JSON.parse zurück in eine Liste (beim Laden).
  // try/catch fängt Fehler ab, damit die App nicht abstürzt, falls der Speicher nicht verfügbar ist.
  function loadHabits() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
      habits = raw ? JSON.parse(raw) : [];
    } catch (e) {
      habits = [];
    }
    loaded = true;
    render();
  }

  function saveHabits() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
    } catch (e) {
      contentEl.insertAdjacentHTML('afterbegin', '<div class="error-banner">Speichern fehlgeschlagen. Bitte erneut versuchen.</div>');
    }
  }

  function render() {
    if (!loaded) {
      contentEl.innerHTML = '<div class="loading">Lade deine Daten …</div>';
      return;
    }

    const doneCount = habits.filter(h => (h.completions || []).includes(todayStr())).length;
    if (habits.length > 0) {
      subtitleEl.textContent = doneCount + ' von ' + habits.length + ' heute erledigt';
    } else {
      subtitleEl.textContent = 'Tippe den Kreis, wenn du eine Gewohnheit heute erledigt hast.';
    }

    if (habits.length === 0) {
      contentEl.innerHTML = '<div class="empty-state"><div class="big">Noch keine Gewohnheiten</div>Füge unten deine erste hinzu.</div>';
      return;
    }

    contentEl.innerHTML = '<div class="habit-list">' +
      habits.map(h => {
        const isDone = (h.completions || []).includes(todayStr());
        const streak = computeStreak(h.completions || []);
        return `
          <div class="habit-card ${isDone ? 'done' : ''}">
            <button class="check-btn ${isDone ? 'done' : ''}" onclick="toggleToday('${h.id}')" aria-label="Als erledigt markieren">
              ${isDone ? '✓' : ''}
            </button>
            <div class="habit-info">
              <p class="habit-name">${escapeHtml(h.name)}</p>
              <div class="streak-row">
                <span class="streak-num">${streak}</span>
                <span>${streak === 1 ? 'Tag Serie' : 'Tage Serie'}</span>
              </div>
            </div>
            <button class="delete-btn" onclick="deleteHabit('${h.id}')" aria-label="Löschen">✕</button>
          </div>
        `;
      }).join('') +
      '</div>';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  window.toggleToday = function(id) {
    const habit = habits.find(h => h.id === id);
    if (!habit) return;
    habit.completions = habit.completions || [];
    const today = todayStr();
    const idx = habit.completions.indexOf(today);
    if (idx >= 0) {
      habit.completions.splice(idx, 1);
    } else {
      habit.completions.push(today);
    }
    render();
    saveHabits();
  };

  window.deleteHabit = function(id) {
    habits = habits.filter(h => h.id !== id);
    render();
    saveHabits();
  };

  addForm.addEventListener('submit', function(e) {
    e.preventDefault();
    const name = habitInput.value.trim();
    if (!name) return;
    habits.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      name: name,
      createdAt: todayStr(),
      completions: []
    });
    habitInput.value = '';
    render();
    saveHabits();
  });

  // ---- Datensicherung ----

  function setStatus(text, isError) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status' + (isError ? ' error' : '');
  }

  // Export: Die Liste wird als Text (JSON) in eine Datei geschrieben und
  // über einen unsichtbaren Download-Link an den Browser übergeben.
  function exportData() {
    const payload = {
      app: 'maximize',
      version: 1,
      exportedAt: new Date().toISOString(),
      habits: habits
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'maximize-sicherung-' + todayStr() + '.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    setStatus('Sicherung gespeichert (' + habits.length + ' Gewohnheiten).', false);
  }

  // Prüft, ob ein Eintrag aus einer Datei wie eine echte Gewohnheit aussieht.
  // Dateien kommen von außen, deshalb vertrauen wir ihnen nicht blind:
  // Die ID landet später im HTML und darf nur Buchstaben und Ziffern enthalten.
  function isValidHabit(h) {
    return h
      && typeof h.id === 'string' && /^[a-z0-9]{1,40}$/i.test(h.id)
      && typeof h.name === 'string' && h.name.trim().length > 0 && h.name.length <= 40
      && Array.isArray(h.completions)
      && h.completions.every(d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d));
  }

  // Import: Die Daten aus der Datei werden mit den vorhandenen ZUSAMMENGEFÜHRT.
  // Nichts wird überschrieben oder gelöscht: neue Gewohnheiten kommen dazu,
  // bei gleicher ID werden die erledigten Tage vereint.
  async function importData(file) {
    try {
      const data = JSON.parse(await file.text());
      // 'wegmarken' akzeptieren wir weiter, damit ältere Sicherungen noch lesbar sind
      if (!data || !['maximize', 'wegmarken'].includes(data.app) || !Array.isArray(data.habits)) {
        throw new Error('format');
      }
      const valid = data.habits.filter(isValidHabit);
      let added = 0;
      valid.forEach(incoming => {
        const existing = habits.find(h => h.id === incoming.id);
        if (existing) {
          existing.completions = Array.from(new Set([...(existing.completions || []), ...incoming.completions]));
        } else {
          habits.push({
            id: incoming.id,
            name: incoming.name.trim(),
            createdAt: typeof incoming.createdAt === 'string' ? incoming.createdAt : todayStr(),
            completions: Array.from(new Set(incoming.completions))
          });
          added++;
        }
      });
      render();
      saveHabits();
      const skipped = data.habits.length - valid.length;
      setStatus('Wiederhergestellt: ' + added + ' neu, ' + (valid.length - added) + ' zusammengeführt'
        + (skipped ? ', ' + skipped + ' übersprungen' : '') + '.', false);
    } catch (e) {
      setStatus('Diese Datei ist keine gültige Sicherung von Maximize.', true);
    }
  }

  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) importData(file);
    e.target.value = ''; // damit dieselbe Datei später erneut gewählt werden kann
  });

  showTodayLabel();
  loadHabits();

  // Meldet den Service Worker (sw.js) beim Browser an, damit die App offline starten kann.
  // Das geht nur über https (oder localhost), nicht beim Öffnen der Datei per Doppelklick,
  // deshalb die Prüfung davor.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
